# Render's free plan puts the app to sleep after ~15 min without visitors, which also stops the
# news worker inside it. This pings the health URL every 10 minutes, Mon-Fri 07:30-20:30 IST, so news
# keeps being collected through the trading day (stays well inside Render's 750 free hours/month).
name: keep-awake
on:
  schedule:
    - cron: "*/10 2-14 * * 1-5"   # UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping F&O News
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://fno-news.onrender.com/_stcore/health
